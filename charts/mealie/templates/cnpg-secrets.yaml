{{- if .Values.cnpg.enabled }}
{{- $existingSuperuserSecret := lookup "v1" "Secret" .Release.Namespace .Values.cnpg.cluster.superuserSecret }}
{{- $superuserPassword := randAlphaNum 16 | b64enc }}
{{- if and $existingSuperuserSecret (hasKey $existingSuperuserSecret.data "password") }}
{{- $superuserPassword = index $existingSuperuserSecret.data "password" }}
{{- end }}
{{- $existingAppSecret := lookup "v1" "Secret" .Release.Namespace .Values.cnpg.cluster.appSecret }}
{{- $appPassword := randAlphaNum 16 | b64enc }}
{{- if and $existingAppSecret (hasKey $existingAppSecret.data "password") }}
{{- $appPassword = index $existingAppSecret.data "password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cnpg.cluster.superuserSecret }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ "postgres" | b64enc }}
  password: {{ $superuserPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cnpg.cluster.appSecret }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: Opaque
data:
  username: {{ "mealie" | b64enc }}
  password: {{ $appPassword }}
{{- end }}