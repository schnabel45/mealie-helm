#
# IMPORTANT NOTE
#
# This chart inherits from the bjw-s library chart. You can check the default values/options here:
# https://github.com/bjw-s/helm-charts/tree/main/charts/library/common
#
strategy:
  type: Recreate

controllers:
  main:
    enabled: true
    initContainers:
      wait-for-db:
        name: wait-for-db
        image:
          repository: postgres
          tag: "15"
          pullPolicy: IfNotPresent
        command:
          - pg_isready
          - -h
          - "mealie-postgres-rw"
          - -p
          - "5432"
          - -U
          - "mealie"
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: "mealie-postgres-app"
                key: password
    containers:
      main:
        image:
          # -- image repository
          repository: ghcr.io/mealie-recipes/mealie
          # -- image tag
          # @default -- chart.appVersion
          tag: "{{ .Chart.AppVersion }}"
          # -- image pull policy
          pullPolicy: IfNotPresent
        # -- environment variables.
        # @default -- See below
        env:
          - name: TZ
            value: America/New_York
          - name: POSTGRES_SERVER
            value: "{{ if .Values.cnpg.enabled }}{{ .Values.cnpg.cluster.name }}-rw{{ end }}"
          - name: POSTGRES_PORT
            value: "{{ if .Values.cnpg.enabled }}5432{{ end }}"
          - name: POSTGRES_DB
            value: "{{ if .Values.cnpg.enabled }}{{ .Values.cnpg.cluster.bootstrap.initdb.database }}{{ end }}"
          - name: POSTGRES_USER
            value: "{{ if .Values.cnpg.enabled }}{{ .Values.cnpg.cluster.bootstrap.initdb.owner }}{{ end }}"
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{ if .Values.cnpg.enabled }}{{ .Values.cnpg.cluster.appSecret }}{{ end }}"
                key: password

# -- Configures service settings for the chart. Normally this does not need to be modified.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      http: 
        port: 9000

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main: # the controller with the "main" identifier
        main: # the container with the "main" identifier
          - path: /app/data/
            readOnly: false

# Cloud Native PostgreSQL configuration
cnpg:
  enabled: true
  cluster:
    name: mealie-postgres
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:15.6
    storage:
      size: 10Gi
      storageClass:
    postgresql:
      parameters:
        max_connections: "100"
        shared_buffers: "256MB"
    superuserSecret: mealie-postgres-superuser
    appSecret: mealie-postgres-app
    bootstrap:
      initdb:
        database: mealie
        owner: mealie
        secret:
          name: mealie-postgres-app
    monitoring:
      enablePodMonitor: false